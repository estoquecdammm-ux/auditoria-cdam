<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>Auditoria Operacional · CDAM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#1B2433; --muted:#5E6A7D; --line:#D8DEE7;
  --navy:#1F2A44; --navy-ink:#FFFFFF; --yellow:#F2B705; --stripe-dark:#22262E;
  --ok:#1E8E5A; --ok-bg:#DDF3E8; --warn:#B7791F; --warn-bg:#FDF0D5; --bad:#C0392B; --bad-bg:#FBE1DE; --info:#2C6CB0; --info-bg:#DCE9F7;
  --crit:#7A1FA2; --crit-bg:#F0DEF7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161E; --surface:#1B212C; --surface-2:#222A37; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2F3847;
  --navy:#0E1420; --ok-bg:#16372A; --warn-bg:#3A2E14; --bad-bg:#3D1C19; --info-bg:#172C44; --crit-bg:#2F1A3B;
}}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1B212C; --surface-2:#222A37; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2F3847;
  --navy:#0E1420; --ok-bg:#16372A; --warn-bg:#3A2E14; --bad-bg:#3D1C19; --info-bg:#172C44; --crit-bg:#2F1A3B;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app-container{max-width:1400px;margin:0 auto;padding:0 16px 48px}

/* topo */
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--yellow);color:var(--stripe-dark);display:grid;place-items:center;font:800 18px "Barlow Condensed",sans-serif}
.brand b{font:700 20px/1 "Barlow Condensed",sans-serif;display:block}
.brand small{opacity:.7;font-size:12px}
.nav a{color:var(--navy-ink);opacity:.75;text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:600;font-size:14px}
.nav a.on{opacity:1;background:rgba(255,255,255,.12)}
.mode{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;color:var(--navy-ink);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.mode button.on{background:var(--navy-ink);color:var(--navy)}
.mode button.on.exec{background:var(--yellow);color:var(--stripe-dark)}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--stripe-dark) 12px 24px);display:none}
body.exec .tape{display:block}

/* abas */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--yellow)}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:22px;margin-bottom:10px}
.grid{display:grid;gap:16px}
@media(min-width:900px){.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{margin-left:auto}

/* herói do dia */
.hero{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:20px;position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,var(--stripe-dark) 10px 20px)}
.hero .date{opacity:.75;font-size:14px}
.hero .who{font:800 clamp(38px,9vw,64px)/1 "Barlow Condensed",sans-serif;margin:6px 0 4px}
.hero .role{opacity:.8}
.hero .stats{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.hero .stats div{font-size:13px;opacity:.85}
.hero .stats b{display:block;font:700 26px/1.1 "Barlow Condensed",sans-serif;opacity:1}

.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--yellow);color:var(--stripe-dark);border-color:transparent}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.exec-only{display:none!important}
body.exec .exec-only{display:revert!important}
body.exec .exec-only.btn{display:inline-block!important}
body.exec .exec-only.btn.block{display:block!important}

.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.prog{margin-bottom:12px}
.prog .row{font-size:14px;margin-bottom:4px}

/* listas */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--line)}
.dot.em_andamento{background:var(--warn);border-color:var(--warn)}
.dot.concluido{background:var(--ok);border-color:var(--ok)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-baixa{background:var(--info-bg);color:var(--info)}
.b-media{background:var(--warn-bg);color:var(--warn)}
.b-alta{background:var(--bad-bg);color:var(--bad)}
.b-critica{background:var(--crit-bg);color:var(--crit)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-pend{background:var(--warn-bg);color:var(--warn)}
.b-neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.pend{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.pend.done{border-left-color:var(--ok)}
.pend .num{font:700 18px "Barlow Condensed",sans-serif}
.photo{width:72px;height:72px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}

/* semana */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);min-height:96px;font-size:13px}
.day.today{border:2px solid var(--yellow);background:var(--surface)}
.day b{display:block;font:700 16px "Barlow Condensed",sans-serif}
@media(max-width:560px){.week{grid-template-columns:1fr}.day{min-height:auto;display:flex;gap:10px;align-items:center}}

/* mês */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13px}
.month .h{font-weight:700;color:var(--muted);text-align:center;padding:4px}
.month .c{aspect-ratio:1;border-radius:8px;padding:4px;background:var(--surface-2);border:1px solid var(--line);position:relative}
.month .c.x{visibility:hidden}
.month .c i{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{font:800 34px/1 "Barlow Condensed",sans-serif;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:130px 1fr 36px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar div{height:14px;border-radius:4px;background:var(--navy)}
:root[data-theme="dark"] .hbar div{background:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbar div{background:var(--yellow)}}

/* filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}

/* tabela */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:24px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface-2);padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px}
.chips button.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.auto{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:12px}

.back{border:0;background:none;color:var(--muted);font-weight:600;padding:12px 0}
.note{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{max-width:420px;margin:32px auto}
.field input,.field textarea{background:var(--surface-2)}
body.busy{cursor:progress}
body.busy .btn{pointer-events:none;opacity:.7}
.month .c.today-c{border:2px solid var(--yellow)}
.nav a#navSair{opacity:.6}
.credito{text-align:center;font-size:10px;opacity:.18;margin-top:32px;color:var(--muted)}

.fslot{width:112px;height:112px;border:2px dashed var(--line);border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden;padding:0;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted)}
.fslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fslot.ok{border-style:solid;border-color:var(--ok)}
.fslot.ok span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;padding:2px}
.thumb{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0;width:84px;overflow:hidden}
.thumb img{width:100%;height:84px;object-fit:cover;display:block;background:var(--surface-2)}
.thumb span{font-size:11px;display:block;padding:2px 4px;color:var(--muted)}
.thumb.sem img{visibility:hidden}
.fotobig img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.pend.oc-resolvida{border-left-color:var(--ok)}
.pend.oc-em_analise{border-left-color:var(--info)}
.pend.oc-cancelada{border-left-color:var(--line);opacity:.8}
.pend.oc .s{margin-top:2px}

.hist{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.hist.open{border-color:var(--yellow)}
.histhead{border:0;background:none;padding:4px 0;text-align:left;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;flex:1;min-width:240px}
.histbody{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.logoprev{max-height:56px;max-width:200px;background:#fff;border-radius:6px;padding:4px;border:1px solid var(--line)}
.brand-logo{height:30px;width:auto;display:block}
@media(max-width:480px){.brand-logo{height:24px}.brand b{font-size:17px}}
.vbars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.vbars div{flex:1 0 14px;min-width:14px;background:var(--navy);border-radius:3px 3px 0 0;position:relative}
.vbars div.fds{background:var(--line)}
:root[data-theme="dark"] .vbars div:not(.fds){background:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vbars div:not(.fds){background:var(--yellow)}}
.vlabels{display:flex;gap:3px;font-size:10px;color:var(--muted);overflow-x:auto}
.vlabels span{flex:1 0 14px;min-width:14px;text-align:center}
.kpi.alerta b{color:var(--bad)}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.hbar b{text-align:right}
.semanal{border-left:5px solid var(--yellow)}
.item .ordem{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:700 13px "Barlow Condensed",sans-serif;flex:none}
.item.travado{opacity:.55}
.panel.trava{border-color:var(--bad);border-width:2px}
.dica{font-size:13px;margin:-6px 0 10px;min-height:18px;color:var(--muted)}
.dica[data-tipo="ok"]{color:var(--ok);font-weight:600}
.dica[data-tipo="novo"]{color:var(--warn);font-weight:600}
</style>
</head>

/* ================= DATA E HORA (sempre UTC-3, nunca toISOString do "agora") ================= */
const pad = n => String(n).padStart(2, "0");
const agoraBR = () => new Date(Date.now() - 3 * 3600 * 1000);
function todayStr() { const d = agoraBR(); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function nowISO() { const d = agoraBR(); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}-03:00`; }
const horaDe = iso => iso ? iso.slice(11, 16) : "--:--";
// datas "AAAA-MM-DD" tratadas ao meio-dia UTC (aritmética de calendário, sem fuso)
const parseD = s => new Date(s + "T12:00:00Z");
const fmtD = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const addDias = (s, n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); };
const dow = s => parseD(s).getUTCDay();
const segundaDe = s => addDias(s, -((dow(s) + 6) % 7));
const diaUtil = s => dow(s) >= 1 && dow(s) <= 5;
const DIAS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const brData = s => s ? s.split("-").reverse().join("/") : "";
function duracao(a, b) {
  if (!a || !b) return "—";
  const m = Math.round((new Date(b) - new Date(a)) / 60000);

function poolRodizio() {
  const rot = S.colabs.filter(c => c.ativo && !c.fixo);
  return rot.length ? rot : S.colabs.filter(c => c.ativo);
}
async function getAtribuicaoDoDia(data) {
  const ref = doc(db, "atribuicoes", data);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  if (!diaUtil(data)) return null;
  const pool = poolRodizio();
  if (!pool.length) return null;
  const prev = await getDocs(query(collection(db, "atribuicoes"), where("data", "<", data), orderBy("data", "desc"), limit(1)));
  let prox = pool[0];
  if (!prev.empty) {
    const idx = pool.findIndex(c => c.id === prev.docs[0].data().colaborador_id);
    prox = pool[(idx + 1) % pool.length];
  }
  const novo = { data, dia_semana: DIAS[dow(data)], colaborador_id: prox.id, colaborador_nome: prox.nome, criado_em: nowISO(), criado_ts: serverTimestamp() };
  return runTransaction(db, async tx => {
    const s = await tx.get(ref);
    if (s.exists()) return s.data();
    tx.set(ref, novo);
    return novo;
  });
}
async function getProgramacaoSemana(ref) {
  const seg = segundaDe(ref), dias = [];

}

function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = 0.72, out = c.toDataURL("image/jpeg", q);
      while (out.length > 700000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(falha("Não foi possível ler a imagem.")); };
    img.src = url;
  });
}

async function salvarOcorrencia() {

    .filter(o => o.tipo_ocorrencia === dd.tipo && o.auditoria_data >= lim && o.status !== "cancelada")

  const refRef = ref ? doc(db, "ocorrencias", ref.id) : null, vRef = ref ? doc(db, "verificacoes", `${S.hoje}_${ref.id}`) : null;
  const cRef = doc(db, "contadores", "ocorrencias"), audRef = doc(db, "auditorias", aud.id), setRef = doc(db, "auditoria_setores", set.id);
  const ocRef = doc(collection(db, "ocorrencias"));
  const fotoRefs = { antes: F.fotos.antes ? doc(collection(db, "fotos")) : null, depois: F.fotos.depois ? doc(collection(db, "fotos")) : null };
  let numero = "";
  await runTransaction(db, async tx => {
    const c = await tx.get(cRef), a = await tx.get(audRef), st = await tx.get(setRef);
    const r = refRef ? await tx.get(refRef) : null, v = vRef ? await tx.get(vRef) : null;

    if (v && v.exists()) throw falha(`${ref.numero} já foi conferida hoje.`);
    const seq = (c.exists() ? c.data().ultimo || 0 : 0) + 1;
    numero = "#" + String(seq).padStart(6, "0");

    tx.set(ocRef, {
      numero, numero_seq: seq, auditoria_id: aud.id, auditoria_data: aud.data,
      setor_id: set.setor_id, setor_nome: set.setor_nome, auditoria_setor_id: set.id,
      tipo_ocorrencia: dd.tipo, produto_codigo: dd.cod, produto_descricao: dd.pdesc, local: dd.local, descricao: dd.desc,
      gravidade: F.grav, foto_antes_id: fotoRefs.antes?.id || null, foto_depois_id: fotoRefs.depois?.id || null,
      acao_realizada: F.acao, responsavel: dd.resp, observacao: dd.obs,
      status: resolv ? "resolvida" : ref ? "pendente" : "em_analise",
      ref_ocorrencia_id: ref?.id || null, ref_numero: ref?.numero || null, ref_data: ref?.auditoria_data || null,
      origem_numero: ref ? (ref.origem_numero || ref.numero) : null, origem_data: ref ? (ref.origem_data || ref.auditoria_data) : null,
      origem_registrado_em: ref ? (ref.origem_registrado_em || ref.registrado_em) : null,
      auditor_id: aud.colaborador_id, auditor_nome: aud.colaborador_nome, registrado_em: agora, registrado_por_uid: S.user.uid,
      reincidencia: !!prev, reincidencia_de: prev?.numero || null,
      data_resolucao: resolv ? agora : null, resolvido_por_nome: resolv ? aud.colaborador_nome : null,
      descricao_solucao: resolv ? "Resolvido na hora da auditoria" : null,
      fotos_apagadas: false, criado_ts: serverTimestamp(),
    });
    tx.set(cRef, { ultimo: seq });
    if (ref) {
      const rd = r.data();
      tx.set(vRef, {
        ocorrencia_id: ref.id, ocorrencia_numero: ref.numero, ocorrencia_tipo: rd.tipo_ocorrencia, ocorrencia_setor: rd.setor_nome, ocorrencia_gravidade: rd.gravidade,
        auditor_id: aud.colaborador_id, auditor_nome: aud.colaborador_nome, data_verificacao: agora, dia: S.hoje, auditoria_id: aud.id,
        resultado: "continua_pendente", observacao: `Registrada de novo como ${numero}`, foto_id: fotoRefs.antes?.id || null,
        nova_ocorrencia_id: ocRef.id, nova_ocorrencia_numero: numero, registrado_por_uid: S.user.uid, criado_ts: serverTimestamp(),
      });
      tx.update(refRef, { status: "substituida", substituida_por_id: ocRef.id, substituida_por_numero: numero, data_substituicao: agora,
        ultima_verificacao_em: agora, ultima_verificacao_resultado: "continua_pendente", verificacoes_count: (rd.verificacoes_count || 0) + 1 });
    }
    tx.update(audRef, { total_ocorrencias: (a.data().total_ocorrencias || 0) + 1 });
    tx.update(setRef, { ocorrencias_count: (st.data().ocorrencias_count || 0) + 1 });

  if (PROD && F.prod?.deveAprender()) PROD.aprender(dd.cod, dd.pdesc, "auditoria").catch(() => {});

async function excluirOcorrencia(id) {
  const o = [...S.ocsHoje, ...S.emAnalise, ...(S.todasOcs || [])].find(x => x.id === id);
  if (!o || !S.isAdmin) return;
  if (!confirm(`Excluir a ocorrência ${o.numero}? Não dá para desfazer.`)) return;
  const aRef = doc(db, "auditorias", o.auditoria_id), sRef = doc(db, "auditoria_setores", o.auditoria_setor_id);
  const filhos = [];
  for (const col of ["fotos", "verificacoes"]) (await getDocs(query(collection(db, col), where("ocorrencia_id", "==", id)))).docs.forEach(d => filhos.push(d.ref));
  await runTransaction(db, async tx => {
    const a = await tx.get(aRef), s = await tx.get(sRef);
    FOTO_CAMPOS.forEach(k => { if (o[k]) tx.delete(doc(db, "fotos", o[k])); });
    filhos.forEach(r => tx.delete(r));
    tx.delete(doc(db, "ocorrencias", id));
    if (a.exists()) tx.update(aRef, { total_ocorrencias: Math.max(0, (a.data().total_ocorrencias || 1) - 1) });
    if (s.exists()) tx.update(sRef, { ocorrencias_count: Math.max(0, (s.data().ocorrencias_count || 1) - 1) });
  });
  toast(`Ocorrência ${o.numero} excluída`);
}

async function limparFotosAntigas() {
  if (limpezaFeita || !S.isAdmin) return;
  limpezaFeita = true;
  const corte = addDias(S.hoje, -90);
  let n = 0;
  for (const st of ["resolvida", "cancelada", "substituida"]) {
    const snap = await getDocs(query(collection(db, "ocorrencias"), where("status", "==", st), where("fotos_apagadas", "==", false)));
    for (const d of snap.docs) {
      const o = d.data(), quando = String(o.data_resolucao || o.data_cancelamento || o.data_substituicao || "").slice(0, 10);
      if (!quando || quando >= corte) continue;
      const b = writeBatch(db);
      FOTO_CAMPOS.forEach(k => { if (o[k]) b.delete(doc(db, "fotos", o[k])); });
      (await getDocs(query(collection(db, "fotos"), where("ocorrencia_id", "==", d.id)))).docs.forEach(f => b.delete(f.ref));
      b.update(d.ref, { fotos_apagadas: true, fotos_apagadas_em: nowISO() });
      await b.commit(); n++;
    }
  }
  if (n) toast(`Limpeza: fotos de ${n} ocorrência(s) antigas removidas`);
}

/* Gerador do relatório Word — recebe a biblioteca docx (D) e os dados já prontos.
   dados = { cfg, aud, setores, ocorrencias, verificacoes, fotos: {id: {bytes, w, h, type}}, logo: {bytes,w,h,type}|null, geradoEm } */
function montarRelatorio(D, dados) {
  const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType, AlignmentType,
    ImageRun, Header, Footer, PageNumber, VerticalAlign, TableLayoutType, HeadingLevel } = D;
  const { cfg, aud, setores, ocorrencias, verificacoes, fotos, logo, geradoEm } = dados;
  const NAVY = "1F2A44", AMARELO = "F2B705", CINZA = "5E6A7D", LINHA = "D8DEE7", FUNDO = "F3F5F8";
  const W = 10206; // largura útil A4 com margens de 1,5 cm
  const FONTE = "Arial";
  const br = s => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "—";
  const hr = s => s ? String(s).slice(11, 16) : "—";
  const dur = (a, b) => { if (!a || !b) return "—"; const m = Math.round((new Date(b) - new Date(a)) / 60000); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`; };
  const GRAV = { baixa: ["Baixa", "DCE9F7", "2C6CB0"], media: ["Média", "FDF0D5", "8A5A12"], alta: ["Alta", "FBE1DE", "C0392B"], critica: ["Crítica", "F0DEF7", "7A1FA2"] };
  const ST = { em_analise: "Em análise", pendente: "Pendente", parcialmente_resolvida: "Parcialmente resolvida", resolvida: "Resolvida", cancelada: "Cancelada", substituida: "Substituída" };
  const ACAO = { resolvido_hora: "Resolvido na hora", encaminhado: "Encaminhado", nao_possivel: "Não foi possível" };
  const VER = { resolvido: "Resolvido", parcialmente_resolvido: "Parcialmente resolvido", continua_pendente: "Continua (registrada de novo)" };
  const SETST = { pendente: "Pendente", em_andamento: "Em andamento", concluido: "Concluído" };
  const AUDST = { em_andamento: "Em andamento", finalizada: "Finalizada", reiniciada: "Reiniciada" };

  const t = (text, o = {}) => new TextRun({ text: String(text ?? ""), font: FONTE, size: o.size || 20, bold: o.bold, color: o.color, italics: o.italics });
  const p = (runs, o = {}) => new Paragraph({ children: Array.isArray(runs) ? runs : [runs], spacing: { before: o.before ?? 0, after: o.after ?? 80 }, alignment: o.align, keepNext: o.keepNext, border: o.border });
  const semBorda = { top: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" }, bottom: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" }, left: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" }, right: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" } };
  const borda = c => ({ style: BorderStyle.SINGLE, size: 4, color: c || LINHA });
  const bordas = c => ({ top: borda(c), bottom: borda(c), left: borda(c), right: borda(c) });
  const cel = (children, w, o = {}) => new TableCell({
    children: Array.isArray(children) ? children : [children], width: { size: w, type: WidthType.DXA },
    shading: o.fill ? { type: ShadingType.CLEAR, color: "auto", fill: o.fill } : undefined,
    borders: o.borders || bordas(), margins: { top: 60, bottom: 60, left: 100, right: 100 }, verticalAlign: o.v || VerticalAlign.CENTER, columnSpan: o.span,
  });
  const tabela = (larguras, linhas, o = {}) => new Table({ width: { size: larguras.reduce((a, b) => a + b, 0), type: WidthType.DXA }, columnWidths: larguras, rows: linhas, layout: TableLayoutType.FIXED, borders: o.borders });
  const titulo = (txt) => p([t(txt.toUpperCase(), { bold: true, size: 22, color: NAVY })], { before: 280, after: 120, keepNext: true, border: { bottom: { style: BorderStyle.SINGLE, size: 12, color: AMARELO, space: 4 } } });
  const img = (f, maxW, maxH) => {
    if (!f) return null;
    const k = Math.min(maxW / f.w, maxH / f.h, 1e9);
    return new ImageRun({ type: f.type, data: f.bytes, transformation: { width: Math.round(f.w * k), height: Math.round(f.h * k) } });
  };

  /* ---------- cabeçalho e rodapé ---------- */
  const logoRun = logo ? img(logo, 150, 48) : null;
  const header = new Header({
    children: [tabela([2600, W - 2600], [new TableRow({
      children: [
        cel(p(logoRun ? [logoRun] : [t(cfg.empresa_nome || "", { bold: true, size: 24, color: NAVY })], { after: 0 }), 2600, { borders: semBorda }),
        cel([p([t(cfg.empresa_nome || "", { bold: true, size: 22, color: NAVY })], { align: AlignmentType.RIGHT, after: 0 }),
          p([t(cfg.empresa_subtitulo || "", { size: 16, color: CINZA })], { align: AlignmentType.RIGHT, after: 0 })], W - 2600, { borders: semBorda }),
      ],
    })], { borders: { ...semBorda, insideHorizontal: semBorda.top, insideVertical: semBorda.top } }),
    p([t("")], { after: 0, border: { bottom: { style: BorderStyle.SINGLE, size: 12, color: NAVY, space: 2 } } })],
  });
  const footer = new Footer({
    children: [p([t(`Auditoria de ${br(aud.data)} · ${aud.colaborador_nome} · gerado em ${br(geradoEm)} às ${hr(geradoEm)}    Página `, { size: 16, color: CINZA }),
      new TextRun({ children: [PageNumber.CURRENT], font: FONTE, size: 16, color: CINZA }), t(" de ", { size: 16, color: CINZA }),
      new TextRun({ children: [PageNumber.TOTAL_PAGES], font: FONTE, size: 16, color: CINZA })], { align: AlignmentType.CENTER, after: 0 })],
  });

  /* ---------- números ---------- */
  const novas = ocorrencias;
  const cont = k => novas.filter(k).length;
  const kVer = r => verificacoes.filter(v => v.resultado === r).length;
  const kpis = [
    ["Ocorrências novas", cont(o => !o.ref_ocorrencia_id)], ["Continuações (registradas de novo)", cont(o => !!o.ref_ocorrencia_id)],
    ["Resolvidas na hora", cont(o => o.acao_realizada === "resolvido_hora")], ["Críticas ou altas", cont(o => !o.ref_ocorrencia_id && (o.gravidade === "critica" || o.gravidade === "alta"))],
    ["Pendências conferidas", verificacoes.length], ["Resolvidas na conferência", kVer("resolvido")],
    ["Continuam lá", kVer("continua_pendente") + kVer("parcialmente_resolvido")], ["Reincidências", cont(o => o.reincidencia)],
  ];
  const kw = W / 4;
  const kpiRow = arr => new TableRow({ children: arr.map(([l, v]) => cel([p([t(v, { bold: true, size: 32, color: NAVY })], { after: 0 }), p([t(l, { size: 16, color: CINZA })], { after: 0 })], kw, { fill: FUNDO, borders: bordas("FFFFFF") })) });

  /* ---------- corpo ---------- */
  const corpo = [];
  corpo.push(p([t("Relatório de auditoria operacional", { bold: true, size: 36, color: NAVY })], { before: 120, after: 40 }));
  corpo.push(p([t([aud.dia_semana, br(aud.data)].filter(Boolean).join(", "), { size: 22, color: CINZA })], { after: 200 }));

  const lin = (a, b, c, d) => new TableRow({ children: [cel(p([t(a, { size: 18, color: CINZA })], { after: 0 }), 1900, { fill: FUNDO }), cel(p([t(b, { bold: true })], { after: 0 }), 3203), cel(p([t(c, { size: 18, color: CINZA })], { after: 0 }), 1900, { fill: FUNDO }), cel(p([t(d, { bold: true })], { after: 0 }), 3203)] });
  corpo.push(tabela([1900, 3203, 1900, 3203], [
    lin("Auditor", aud.colaborador_nome, "Status", AUDST[aud.status] || aud.status),
    lin("Início", hr(aud.horario_inicio), "Finalização", hr(aud.horario_finalizacao)),
    lin("Duração", dur(aud.horario_inicio, aud.horario_finalizacao), "Setores concluídos", `${setores.filter(s => s.status === "concluido").length} de ${setores.length}`),
  ]));

  corpo.push(titulo("Resumo"));
  corpo.push(tabela([kw, kw, kw, kw], [kpiRow(kpis.slice(0, 4)), kpiRow(kpis.slice(4))]));

  corpo.push(titulo("Setores"));
  const sw = [4006, 1900, 1400, 1400, 1500];
  const th = (x, w) => cel(p([t(x, { bold: true, size: 18, color: "FFFFFF" })], { after: 0 }), w, { fill: NAVY, borders: bordas(NAVY) });
  corpo.push(tabela(sw, [
    new TableRow({ tableHeader: true, children: ["Setor", "Status", "Abertura", "Conclusão", "Ocorrências"].map((x, i) => th(x, sw[i])) }),
    ...setores.map((s, i) => new TableRow({ children: [s.setor_nome, SETST[s.status] || s.status, hr(s.horario_inicio), hr(s.horario_conclusao), String(s.ocorrencias_count || 0)].map((x, j) => cel(p([t(x)], { after: 0 }), sw[j], { fill: i % 2 ? FUNDO : undefined })) })),
  ]));

  corpo.push(titulo(`Ocorrências registradas (${novas.length})`));
  if (!novas.length) corpo.push(p([t("Nenhuma ocorrência registrada nesta auditoria.", { italics: true, color: CINZA })]));
  novas.forEach(o => {
    const g = GRAV[o.gravidade] || GRAV.media;
    const det = [];
    const campo = (l, v, cor) => { if (v) det.push(p([t(l + ": ", { bold: true, size: 18, color: cor || CINZA }), t(v, { size: 18, bold: !!cor, color: cor })], { after: 40, keepNext: true })); };
    campo("Produto", [o.produto_codigo, o.produto_descricao].filter(Boolean).join(" · "));
    campo("Local", o.local);
    campo("Descrição", o.descricao);
    campo("Ação", ACAO[o.acao_realizada]);
    campo("Responsável", o.responsavel);
    campo("Observação", o.observacao);
    campo("Registrada às", hr(o.registrado_em));
    if (o.ref_numero) campo("Continuação de", `${o.ref_numero} de ${br(o.ref_data)}${o.origem_numero && o.origem_numero !== o.ref_numero ? ` (origem ${o.origem_numero} de ${br(o.origem_data)})` : ""}`, "B7791F");
    if (o.reincidencia) campo("Reincidência", `mesmo tipo e setor que ${o.reincidencia_de} (últimos 10 dias)`, "C0392B");
    if (o.status === "resolvida" && o.acao_realizada !== "resolvido_hora") campo("Solução", `${o.descricao_solucao || ""} (${o.resolvido_por_nome || ""}, ${br(o.data_resolucao)})`);
    if (o.status === "cancelada") campo("Cancelamento", `${o.justificativa || ""} (${o.cancelado_por_nome || ""})`);
    const fs = o.fotos_apagadas ? [] : [["Antes", o.foto_antes_id], ["Depois", o.foto_depois_id], ["Solução", o.foto_solucao_id]].filter(([, id]) => id && fotos[id]);
    const linhas = [
      new TableRow({ cantSplit: true, children: [cel([p([t(`${o.numero}  `, { bold: true, size: 22, color: "FFFFFF" }), t(`${o.tipo_ocorrencia} · ${o.setor_nome}`, { bold: true, size: 20, color: "FFFFFF" })], { after: 0, keepNext: true })], W - 3000, { fill: NAVY, borders: bordas(NAVY) }),
        cel(p([t(`${g[0]} · ${ST[o.status] || o.status}`, { bold: true, size: 18, color: g[2] })], { after: 0, align: AlignmentType.RIGHT, keepNext: true }), 3000, { fill: g[1], borders: bordas(NAVY) })] }),
      new TableRow({ cantSplit: true, children: [cel(det.length ? det : [p([t("")], { keepNext: true })], W, { span: 2, v: VerticalAlign.TOP })] }),
    ];
    if (fs.length) {
      const cw = Math.floor(W / 3);
      linhas.push(new TableRow({ cantSplit: true, children: [cel([tabela(fs.map(() => cw), [new TableRow({ children: fs.map(([l, id]) => cel([p([img(fotos[id], 200, 170)], { after: 20, align: AlignmentType.CENTER }), p([t(l, { size: 16, color: CINZA })], { after: 0, align: AlignmentType.CENTER })], cw, { borders: semBorda })) })], { borders: { ...semBorda, insideHorizontal: semBorda.top, insideVertical: semBorda.top } })], W, { span: 2 })] }));
    } else if (o.fotos_apagadas) {
      linhas.push(new TableRow({ children: [cel(p([t("Fotos removidas após 90 dias da resolução.", { italics: true, size: 16, color: CINZA })], { after: 0 }), W, { span: 2 })] }));
    }
    corpo.push(tabela([W - 3000, 3000], linhas));
    corpo.push(p([t("")], { after: 120 }));
  });

  corpo.push(titulo(`Pendências conferidas (${verificacoes.length})`));
  if (!verificacoes.length) corpo.push(p([t("Nenhuma pendência de dias anteriores para conferir.", { italics: true, color: CINZA })]));
  else {
    const vw = [1300, 3006, 1900, 800, 3200];
    corpo.push(tabela(vw, [
      new TableRow({ tableHeader: true, children: ["Número", "Ocorrência", "Resultado", "Hora", "Observação e foto"].map((x, i) => th(x, vw[i])) }),
      ...verificacoes.map((v, i) => new TableRow({ cantSplit: true, children: [
        cel(p([t(v.ocorrencia_numero, { bold: true })], { after: 0 }), vw[0]),
        cel([p([t(v.ocorrencia_tipo || "")], { after: 0 }), p([t(v.ocorrencia_setor || "", { size: 16, color: CINZA })], { after: 0 })], vw[1]),
        cel(p([t((VER[v.resultado] || v.resultado) + (v.nova_ocorrencia_numero ? " → " + v.nova_ocorrencia_numero : ""), { bold: true, color: v.resultado === "resolvido" ? "1E8E5A" : v.resultado === "parcialmente_resolvido" ? "8A5A12" : "C0392B" })], { after: 0 }), vw[2]),
        cel(p([t(hr(v.data_verificacao))], { after: 0 }), vw[3]),
        cel([...(v.observacao ? [p([t(v.observacao, { size: 18 })], { after: 40 })] : []), ...(fotos[v.foto_id] ? [p([img(fotos[v.foto_id], 190, 120)], { after: 0 })] : [])], vw[4], { v: VerticalAlign.TOP }),
      ] })),
    ]));
  }

  corpo.push(titulo("Observação final"));
  corpo.push(p([t(aud.observacao_final || "Sem observações.", { italics: !aud.observacao_final, color: aud.observacao_final ? undefined : CINZA })]));

  const ass = x => cel([p([t("")], { before: 600, after: 0, border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: NAVY, space: 2 } } }), p([t(x, { size: 18, color: CINZA })], { align: AlignmentType.CENTER, after: 0 })], 4603, { borders: semBorda });
  corpo.push(p([t("")], { before: 200 }));
  corpo.push(tabela([4603, 1000, 4603], [new TableRow({ cantSplit: true, children: [ass(`Auditor: ${aud.colaborador_nome}`), cel(p([t("")]), 1000, { borders: semBorda }), ass("Líder responsável")] })], { borders: { ...semBorda, insideHorizontal: semBorda.top, insideVertical: semBorda.top } }));

  return new Document({
    creator: cfg.empresa_nome || "Auditoria Operacional", title: `Auditoria ${br(aud.data)}`,
    styles: { default: { document: { run: { font: FONTE, size: 20 } } } },
    sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1300, bottom: 1000, left: 850, right: 850, header: 450, footer: 450 } } }, headers: { default: header }, footers: { default: footer }, children: corpo }],
  });
}

const LOGO_PADRAO = () => document.getElementById("logoPadrao")?.src || null;
let docxProm = null;
function carregarDocx() {
  if (window.docx) return Promise.resolve(window.docx);
  return docxProm ||= new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js";
    const tm = setTimeout(() => { docxProm = null; rej(falha("A internet está lenta para carregar o gerador do Word")); }, 20000);
    sc.onload = () => { clearTimeout(tm); window.docx ? res(window.docx) : rej(falha("Biblioteca do Word não carregou.")); };
    sc.onerror = () => { clearTimeout(tm); docxProm = null; rej(falha("Sem internet para carregar o gerador do Word.")); };
    document.head.appendChild(sc);
  });
}
function imgDeDataURL(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image();
    im.onload = () => {
      const bin = atob(url.split(",")[1] || ""), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      res({ bytes, w: im.naturalWidth || im.width, h: im.naturalHeight || im.height, type: url.startsWith("data:image/png") ? "png" : "jpg" });
    };
    im.onerror = () => res(null);
    im.src = url;
  });
}
async function carregarLogo() {
  const s = await getDoc(doc(db, "config", "logo"));
  S.logo = s.exists() && s.data().data ? s.data().data : null;
  return S.logo;
}
function baixarArquivo(blob, nome) {
  const a = document.createElement("a"), url = URL.createObjectURL(blob);
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const nomeArquivo = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
async function gerarRelatorioDocx(audId) {
  toast("Gerando relatório Word…");
  const [D, aSnap] = await Promise.all([carregarDocx(), getDoc(doc(db, "auditorias", audId))]);
  if (!aSnap.exists()) throw falha("Auditoria não encontrada.");
  const aud = aSnap.data();
  const [setSnap, ocSnap, vSnap, logoUrl] = await Promise.all([
    getDocs(query(collection(db, "auditoria_setores"), where("auditoria_id", "==", audId))),
    getDocs(query(collection(db, "ocorrencias"), where("auditoria_id", "==", audId))),
    getDocs(query(collection(db, "verificacoes"), where("dia", "==", aud.data))),
    S.logo === undefined ? carregarLogo() : Promise.resolve(S.logo),
  ]);
  const setores = setSnap.docs.map(d => d.data()).sort(porOrdem);
  const ocorrencias = ocSnap.docs.map(d => d.data()).sort((a, b) => a.numero_seq - b.numero_seq);
  const verificacoes = vSnap.docs.map(d => d.data()).sort((a, b) => String(a.data_verificacao).localeCompare(String(b.data_verificacao)));
  const ids = new Set();
  ocorrencias.forEach(o => { if (!o.fotos_apagadas) FOTO_CAMPOS.forEach(k => o[k] && ids.add(o[k])); });
  verificacoes.forEach(v => v.foto_id && ids.add(v.foto_id));
  const fotos = {};
  await Promise.all([...ids].map(async id => { const f = await imgDeDataURL(await carregarFoto(id)); if (f) fotos[id] = f; }));
  const geradoEm = nowISO();
  const documento = montarRelatorio(D, {
    cfg: { empresa_nome: S.config.empresa_nome ?? "Lojas MM · CDAM", empresa_subtitulo: S.config.empresa_subtitulo ?? "Relatório de auditoria operacional diária" },
    aud, setores, ocorrencias, verificacoes, fotos, logo: await imgDeDataURL(logoUrl || LOGO_PADRAO()), geradoEm,
  });
  const blob = await D.Packer.toBlob(documento);
  baixarArquivo(blob, `Auditoria_${aud.data}_${nomeArquivo(aud.colaborador_nome)}.docx`);
  try { await updateDoc(doc(db, "auditorias", audId), { relatorio_gerado_em: geradoEm }); } catch (e) { console.warn(e); }
  toast("Relatório Word baixado");
}

/* Relatório semanal — dados = { cfg, logo, seg, sex, hoje, dias:[{data, atrib, auds:[]}], ocs, verifs, abertas, fotos, geradoEm } */
function montarRelatorioSemanal(D, dados) {
  const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType, AlignmentType,
    ImageRun, Header, Footer, PageNumber, VerticalAlign, TableLayoutType, PageBreak } = D;
  const { cfg, logo, seg, sex, hoje, dias, ocs, verifs, abertas, fotos, geradoEm } = dados;
  const refFim = sex < hoje ? sex : hoje;
  const NAVY = "1F2A44", AMARELO = "F2B705", CINZA = "5E6A7D", LINHA = "D8DEE7", FUNDO = "F3F5F8";
  const W = 10206, FONTE = "Arial";
  const br = s => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "—";
  const hr = s => s ? String(s).slice(11, 16) : "—";
  const min = a => (a.horario_inicio && a.horario_finalizacao) ? (new Date(a.horario_finalizacao) - new Date(a.horario_inicio)) / 60000 : null;
  const hm = m => m == null ? "—" : `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, "0")}`;
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const num1 = v => v == null ? "—" : v.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  const diasEntre = (a, b) => Math.max(0, Math.round((new Date(String(b).slice(0, 10) + "T12:00:00Z") - new Date(String(a).slice(0, 10) + "T12:00:00Z")) / 86400000));
  const DSEM = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const dsem = s => DSEM[new Date(s + "T12:00:00Z").getUTCDay()];
  const GRAV = { baixa: ["Baixa", "DCE9F7", "2C6CB0"], media: ["Média", "FDF0D5", "8A5A12"], alta: ["Alta", "FBE1DE", "C0392B"], critica: ["Crítica", "F0DEF7", "7A1FA2"] };
  const ST = { em_analise: "Em análise", pendente: "Pendente", parcialmente_resolvida: "Parcialmente resolvida", resolvida: "Resolvida", cancelada: "Cancelada", substituida: "Substituída" };
  const ACAO = { resolvido_hora: "Resolvido na hora", encaminhado: "Encaminhado", nao_possivel: "Não foi possível" };
  const VER = { resolvido: "Resolvido", parcialmente_resolvido: "Parcialmente resolvido", continua_pendente: "Continua (registrada de novo)" };

  const t = (text, o = {}) => new TextRun({ text: String(text ?? ""), font: FONTE, size: o.size || 20, bold: o.bold, color: o.color, italics: o.italics });
  const p = (runs, o = {}) => new Paragraph({ children: Array.isArray(runs) ? runs : [runs], spacing: { before: o.before ?? 0, after: o.after ?? 80 }, alignment: o.align, keepNext: o.keepNext, border: o.border });
  const nada = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" };
  const semBorda = { top: nada, bottom: nada, left: nada, right: nada };
  const semBordaTab = { ...semBorda, insideHorizontal: nada, insideVertical: nada };

async function gerarRelatorioSemanal(seg) {
  const sex = addDias(seg, 4);
  toast("Montando relatório da semana…");
  const [D, auds, atS, ocS, vS, abS] = await Promise.all([
    carregarDocx(), audsEntre(seg, sex),
    getDocs(query(collection(db, "atribuicoes"), where("data", ">=", seg), where("data", "<=", sex))),
    getDocs(query(collection(db, "ocorrencias"), where("auditoria_data", ">=", seg), where("auditoria_data", "<=", sex))),
    getDocs(query(collection(db, "verificacoes"), where("dia", ">=", seg), where("dia", "<=", sex))),
    getDocs(query(collection(db, "ocorrencias"), where("auditoria_data", "<=", sex))),
  ]);
  const atrib = {}; atS.docs.forEach(d => atrib[d.id] = d.data());
  const dias = [0, 1, 2, 3, 4].map(i => { const data = addDias(seg, i); return { data, atrib: atrib[data] || null, auds: auds.filter(a => a.data === data).sort((a, b) => String(a.horario_inicio).localeCompare(String(b.horario_inicio))) }; });
  const ocs = ocS.docs.map(d => d.data());
  const verifs = vS.docs.map(d => d.data());
  // abertas no fim da semana: criadas até sexta e não encerradas até lá
  const fimRef = sex < S.hoje ? sex : S.hoje;
  const abertas = abS.docs.map(d => d.data()).filter(o => {
    if (["em_analise", "pendente", "parcialmente_resolvida"].includes(o.status)) return true;
    const enc = String(o.status === "resolvida" ? o.data_resolucao : o.status === "cancelada" ? o.data_cancelamento : o.status === "substituida" ? o.data_substituicao : "").slice(0, 10);
    return !!enc && enc > fimRef;
  });
  const ids = new Set();
  ocs.forEach(o => { if (!o.fotos_apagadas) FOTO_CAMPOS.forEach(k => o[k] && ids.add(o[k])); });
  if (ids.size > 150 && !confirm(`A semana tem ${ids.size} fotos. O arquivo vai ficar pesado e pode demorar. Continuar?`)) return;
  const fotos = {};
  await Promise.all([...ids].map(async id => { const f = await imgDeDataURL(await carregarFoto(id)); if (f) fotos[id] = f; }));
  const logoUrl = S.logo === undefined ? await carregarLogo() : S.logo;
  const documento = montarRelatorioSemanal(D, {
    cfg: { empresa_nome: S.config.empresa_nome ?? "Lojas MM · CDAM" }, logo: await imgDeDataURL(logoUrl || LOGO_PADRAO()),
    seg, sex, hoje: S.hoje, dias, ocs, verifs, abertas, fotos, geradoEm: nowISO(),
  });
  baixarArquivo(await D.Packer.toBlob(documento), `Semana_${seg}_a_${sex}.docx`);
  toast("Relatório da semana baixado");
}

  const cols = [["Número", o => o.numero], ["Data", o => brData(o.auditoria_data)], ["Auditor", o => o.auditor_nome], ["Setor", o => o.setor_nome], ["Tipo", o => o.tipo_ocorrencia],

    ["Código produto", o => o.produto_codigo], ["Descrição produto", o => o.produto_descricao], ["Local", o => o.local], ["Descrição", o => o.descricao], ["Observação", o => o.observacao],
    ["Registrada em", o => o.registrado_em ? brData(o.registrado_em.slice(0, 10)) + " " + horaDe(o.registrado_em) : ""],

    ["Dias em aberto", o => diasAberto(o)], ["Reincidência", o => o.reincidencia ? "Sim (" + o.reincidencia_de + ")" : "Não"],

function comprimirLogo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 600 / img.width, 300 / img.height);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL("image/png");
      if (out.length > 700000) out = c.toDataURL("image/jpeg", 0.85);
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(falha("Não foi possível ler a imagem do logo.")); };
    img.src = url;
  });
}
async function salvarLogo(file) {

  await setDoc(doc(db, "config", "logo"), { data, alterado_por: S.adminNome, alterado_em: nowISO() });

async function refazerSorteio() {
  const livres = S.progDias.filter(d => d.data >= S.hoje && !(S.progAuds[d.data] || []).length);

  const pool = [...poolRodizio()];
  if (!pool.length) throw falha("Nenhum colaborador ativo.");
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

async function addCad(k, nome) {
  nome = nome.trim();
  if (!nome) throw falha("Digite um nome.");
  const [col, alvo] = COLS[k];
  if (S[alvo].some(x => x.nome.toLowerCase() === nome.toLowerCase())) throw falha("Já existe um cadastro com esse nome.");
  const ordem = Math.max(0, ...S[alvo].map(x => x.ordem || 0)) + 1;
  const dados = { nome, ativo: true, ordem, criado_em: nowISO() };
  if (k === "col") dados.fixo = false;
  await addDoc(collection(db, col), dados);
}
async function updCad(k, id, campos) { await updateDoc(doc(db, COLS[k][0], id), campos); }
async function moverCad(k, id, dir) {
  const lista = S[COLS[k][1]], i = lista.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= lista.length) return;
  const b = writeBatch(db);
  lista.forEach((x, n) => { let o = n + 1; if (n === i) o = j + 1; if (n === j) o = i + 1; b.update(doc(db, COLS[k][0], x.id), { ordem: o }); });
  await b.commit();
}

function semanaHtml(dias, audsMap, destacarHoje = true) {

    <div class="prog"><div class="row"><span>Setores concluídos</span><span class="sp">${concl}/${tot}</span></div><div class="bar"><i style="width:${tot ? concl / tot * 100 : 0}%"></i></div></div>
    ${S.audSet.map((s, k) => {
      const np = pendDoSetor(s.setor_id).length, nf = faltaNoSetor(s.setor_id).length, livre = setorLiberado(s.id);

      ${podeFinalizar() ? "" : `<p class="muted" style="text-align:center;margin:6px 0 0;font-size:14px">${[!setoresOk() ? "conclua todos os setores na ordem" : "", pendOrfas().some(o => !verifDe(o.id)) ? `confira ${pendOrfas().filter(o => !verifDe(o.id)).length} pendência(s) de setor fora da ronda` : ""].filter(Boolean).join(" e ").replace(/^./, c => c.toUpperCase())} para liberar.</p>`}</div>` : ""}

  return hero + acaoHtml + `<div class="grid g2"><div>${setHtml}${blocoPendHoje()}</div>
    <div><div class="panel"><h2>Esta semana</h2>${semanaHtml(S.semana, S.semanaAuds)}</div>${lider}</div></div>`;
}

function blocoPendHoje() {
  const lista = pendDoDia(), idsAbertas = new Set(lista.map(o => o.id)), orfas = new Set(pendOrfas().map(o => o.id));
  const encerradasHoje = S.verifHoje.filter(v => !idsAbertas.has(v.ocorrencia_id));
  const total = lista.length + encerradasHoje.length, feitas = S.verifHoje.length;
  const podeConferir = !!(S.aud?.colaborador_nome || S.atrib?.colaborador_nome);
  const vBadge = v => `<span class="badge ${verifBadge[v.resultado]}">Conferida às ${horaDe(v.data_verificacao)}: ${verifTxt[v.resultado]}${v.nova_ocorrencia_numero ? " → " + esc(v.nova_ocorrencia_numero) : ""}</span>`;
  return `<div class="panel"><h2>Pendências de auditorias anteriores</h2>
  <p class="muted" style="margin-top:-4px">Cada pendência é conferida dentro do próprio setor, na ordem da ronda. O setor só pode ser concluído depois de conferir todas as dele.</p>
  ${total ? `<div class="prog"><div class="row"><span>Conferidas hoje</span><span class="sp">${feitas}/${total}</span></div><div class="bar"><i style="width:${total ? feitas / total * 100 : 0}%"></i></div></div>` : ""}
  ${[...lista].sort((x, y) => { const ix = S.audSet.findIndex(s => s.setor_id === x.setor_id), iy = S.audSet.findIndex(s => s.setor_id === y.setor_id); return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy) || x.numero_seq - y.numero_seq; })
    .map(o => { const v = verifDe(o.id), orf = orfas.has(o.id); return ocCard(o, `<div class="row" style="margin-top:8px"><span class="badge b-neutral">${diasAberto(o)} dia(s) em aberto</span>${v ? vBadge(v) : orf && podeConferir && S.aud?.status === "em_andamento" ? `<span class="s muted">Setor fora da ronda de hoje</span><button class="btn sm primary exec-only sp" data-act="conferir" data-id="${o.id}">Conferir pendência</button>` : `<span class="s muted sp">Conferir no setor ${esc(o.setor_nome)}</span>`}</div>`); }).join("")}
  ${encerradasHoje.map(v => `<div class="pend oc ${v.resultado === "resolvido" ? "oc-resolvida" : "oc-pendente"}"><div class="row"><span class="num">${esc(v.ocorrencia_numero)}</span><span class="badge b-${v.ocorrencia_gravidade}">${gravTxt[v.ocorrencia_gravidade] || ""}</span>${vBadge(v)}</div><div class="t" style="margin-top:6px">${esc(v.ocorrencia_tipo)} · ${esc(v.ocorrencia_setor)}</div><div class="s muted">Por ${esc(v.auditor_nome)}${v.observacao ? ": " + esc(v.observacao) : ""}</div></div>`).join("")}
  ${!total ? `<p class="muted">Nenhuma pendência aberta de dias anteriores.</p>` : ""}</div>`;
}
function telaSetor() {

  const vb = v => `<span class="badge ${verifBadge[v.resultado]}">Conferida às ${horaDe(v.data_verificacao)}: ${verifTxt[v.resultado]}${v.nova_ocorrencia_numero ? " → " + esc(v.nova_ocorrencia_numero) : ""}</span>`;
  const blocoPend = pends.length ? `<div class="panel ${falta.length ? "trava" : ""}"><h2>Pendências de dias anteriores (${pends.length - falta.length}/${pends.length} conferidas)</h2>
    <p class="muted" style="margin-top:-4px">Veja no local se ainda estão lá. Resolvida sai da lista; se continua, registre de novo.</p>
    ${pends.map(o => { const v = verifDe(o.id); return ocCard(o, `<div class="row" style="margin-top:8px"><span class="badge b-neutral">${diasAberto(o)} dia(s) em aberto</span>${v ? vb(v) : podeConf ? `<button class="btn sm primary exec-only sp" data-act="conferir" data-id="${o.id}">Conferir pendência</button>` : ""}</div>`); }).join("")}</div>` : "";
  return `<button class="back" data-act="voltar">‹ Voltar para a auditoria</button>
  <section class="hero" style="padding:16px 20px"><div class="date">Setor · ${stTxt[s.status]}${s.horario_inicio ? " · aberto às " + horaDe(s.horario_inicio) : ""}</div><div class="who" style="font-size:clamp(32px,7vw,48px)">${esc(s.setor_nome)}</div></section>
  ${aberto ? `<div class="row" style="margin-bottom:16px"><button class="btn primary exec-only" data-act="registrar">Registrar ocorrência</button><button class="btn dark exec-only" data-act="concluir-setor" ${falta.length ? "disabled" : ""}>Concluir setor</button>${falta.length ? `<span class="s exec-only" style="color:var(--bad);font-weight:600">🔒 Confira ${falta.length} pendência(s) deste setor para concluir</span>` : ""}</div>`
      : s.status === "concluido" ? `<div class="note">Setor concluído às ${horaDe(s.horario_conclusao)}. Não aceita novas ocorrências.</div>` : ""}
  ${blocoPend}
  <div class="panel"><h2>Ocorrências novas hoje neste setor (${ocs.length})</h2>
  ${ocs.length ? ocs.map(o => ocCard(o, S.isAdmin ? `<div class="row" style="margin-top:8px"><button class="btn sm danger exec-only" data-act="del-oc" data-id="${o.id}">Excluir ocorrência</button></div>` : "")).join("")
      : `<p class="muted">${aberto ? "Nenhuma ocorrência registrada. Se o setor estiver em ordem, conclua o setor." : "Nenhuma ocorrência registrada neste setor."}</p>`}</div>`;
}

function tabPend() {
  if (!S.todasOcs) return `<div class="panel">Carregando ocorrências…</div>`;
  const f = S.pf, uniq = k => [...new Set(S.todasOcs.map(o => o[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const sel = (k, rot, opts) => `<select data-pf="${k}" aria-label="${rot}"><option value="">${rot}: todos</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${f[k] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="panel"><div class="filters">
    <input data-pf="q" placeholder="Buscar número, código, local, descrição…" value="${esc(f.q)}">
    <select data-pf="status" aria-label="Status">${[["abertas", "Status: abertas"], ["", "Status: todos"], ...Object.entries(ocStTxt)].map(([v, l]) => `<option value="${v}" ${f.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    ${sel("grav", "Gravidade", Object.entries(gravTxt).reverse())}
    ${sel("setor", "Setor", uniq("setor_nome").map(x => [x, x]))}
    ${sel("auditor", "Auditor", uniq("auditor_nome").map(x => [x, x]))}
    ${sel("resp", "Responsável", uniq("responsavel").map(x => [x, x]))}
    <select data-pf="ord" aria-label="Ordenar">${[["dias", "Ordenar: dias em aberto"], ["data", "Ordenar: mais recentes"], ["grav", "Ordenar: gravidade"]].map(([v, l]) => `<option value="${v}" ${f.ord === v ? "selected" : ""}>${l}</option>`).join("")}</select>
  </div><div class="row" style="margin-bottom:8px"><span class="muted" id="pfConta"></span><button class="btn sm sp" data-act="recarregar-pend">Atualizar</button></div>
  <div id="pfLista">${listaPend()}</div></div>`;
}
function filtrarPend() {
  const f = S.pf, q = f.q.trim().toLowerCase();
  let l = S.todasOcs.filter(o =>
    (f.status === "abertas" ? ["em_analise", "pendente", "parcialmente_resolvida"].includes(o.status) : !f.status || o.status === f.status)
    && (!f.grav || o.gravidade === f.grav) && (!f.setor || o.setor_nome === f.setor) && (!f.auditor || o.auditor_nome === f.auditor) && (!f.resp || o.responsavel === f.resp)
    && (!q || [o.numero, o.produto_codigo, o.produto_descricao, o.local, o.descricao, o.tipo_ocorrencia, o.responsavel].join(" ").toLowerCase().includes(q)));
  const cmp = { dias: (a, b) => diasAberto(b) - diasAberto(a) || b.numero_seq - a.numero_seq, data: (a, b) => b.numero_seq - a.numero_seq, grav: (a, b) => GRAV_PESO[b.gravidade] - GRAV_PESO[a.gravidade] || diasAberto(b) - diasAberto(a) };
  return l.sort(cmp[f.ord]);
}
function listaPend() {
  const l = filtrarPend();
  queueMicrotask(() => { const c = $("#pfConta"); if (c) c.textContent = `${l.length} ocorrência(s)`; });
  if (!l.length) return `<p class="muted">Nenhuma ocorrência com esses filtros.</p>`;
  return l.map(o => {
    const aberta = !["resolvida", "cancelada", "substituida"].includes(o.status);
    return ocCard(o, `<div class="row" style="margin-top:8px"><span class="badge b-neutral">${diasAberto(o)} dia(s) ${aberta ? "em aberto" : "até encerrar"}</span>
      ${aberta ? `<div class="sp row"><button class="btn sm primary exec-only" data-act="resolver" data-id="${o.id}">Resolver</button>${S.isAdmin ? `<button class="btn sm danger exec-only" data-act="analise-cancel" data-id="${o.id}">Cancelar</button>` : ""}</div>` : ""}
      ${S.isAdmin ? `<button class="btn sm exec-only${aberta ? "" : " sp"}" data-act="del-oc" data-id="${o.id}">Excluir</button>` : ""}</div>`);
  }).join("");
}
function tabDias() {
  const [y, m] = S.mes.split("-").map(Number);
  const first = dow(S.mes + "-01"), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cor = { ok: "var(--ok)", and: "var(--info)", rei: "var(--crit)", nao: "var(--bad)", prog: "var(--line)" };
  let cells = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map(h => `<div class="h">${h}</div>`).join("");
  for (let i = 0; i < first; i++) cells += `<div class="c x"></div>`;
  for (let d = 1; d <= n; d++) {
    const data = `${S.mes}-${pad(d)}`;
    let k = "";
    if (diaUtil(data)) {
      k = statusDoDia(S.mesAuds, data);
      if (k === "prog" && !S.mesAtrib[data] && data > S.hoje) k = "";
    }
    cells += `<div class="c${data === S.hoje ? " today-c" : ""}" title="${k ? stDiaTxt[k] : ""}">${d}${k ? `<i style="background:${cor[k]}"></i>` : ""}</div>`;
  }
  const nomeMes = new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString("pt-BR", { month: "long", year: "numeric", timeZone: "UTC" });
  const lista = [...S.mesAuds].sort((a, b) => b.data.localeCompare(a.data) || String(b.horario_inicio).localeCompare(String(a.horario_inicio)));
  return `<div class="panel"><div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="mes" data-v="-1">‹</button><h2 style="margin:0">${nomeMes}</h2><button class="btn sm" data-act="mes" data-v="1">›</button></div>
  <div class="month">${cells}</div>
  <div class="legend"><span style="--c:var(--ok)">Concluída</span><span style="--c:var(--info)">Em andamento</span><span style="--c:var(--crit)">Reiniciada</span><span style="--c:var(--bad)">Não realizada</span><span style="--c:var(--line)">Programada</span></div></div>
  <div class="panel"><h2>Auditorias do mês</h2>${lista.length ? `<div class="tw"><table><thead><tr><th>Data</th><th>Auditor</th><th>Início</th><th>Fim</th><th>Duração</th><th>Status</th><th></th></tr></thead><tbody>
  ${lista.map(a => `<tr><td>${brData(a.data)}</td><td>${esc(a.colaborador_nome)}</td><td>${horaDe(a.horario_inicio)}</td><td>${horaDe(a.horario_finalizacao)}</td><td>${duracao(a.horario_inicio, a.horario_finalizacao)}</td><td><span class="badge ${a.status === "finalizada" ? "b-ok" : a.status === "reiniciada" ? "b-critica" : "b-pend"}">${audTxt[a.status]}</span></td><td>${a.status === "finalizada" ? `<button class="btn sm" data-act="docx" data-id="${a.id}">Word</button>` : ""}${S.isAdmin ? ` <button class="btn sm danger" data-act="excluir" data-id="${a.id}">Excluir</button>` : ""}</td></tr>`).join("")}
  </tbody></table></div>` : `<p class="muted">Nenhuma auditoria neste mês.</p>`}</div>`;
}

function admProg() {
  if (!S.progDias.length) return `<div class="panel">Carregando programação…</div>`;
  const seg = segundaDe(S.progRef);
  const opts = sel => poolRodizio().concat(S.colabs.filter(c => c.ativo && c.fixo && !poolRodizio().includes(c))).map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.nome)}${c.fixo ? " (fixo)" : ""}</option>`).join("");
  return `<div class="panel"><div class="row"><button class="btn sm" data-act="semana" data-v="-7">‹</button><h2 style="margin:0">Semana de ${brData(seg)}</h2><button class="btn sm" data-act="semana" data-v="7">›</button><button class="btn sm sp" data-act="sorteio">Refazer sorteio</button></div>
  <p class="muted">O responsável de cada dia fica gravado assim que é definido. Atualizar a página não sorteia de novo.</p>
  ${semanaHtml(S.progDias, S.progAuds)}
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Dia</th><th>Responsável</th><th>Situação</th></tr></thead><tbody>
  ${S.progDias.map(d => {
    const iniciado = (S.progAuds[d.data] || []).length > 0, passado = d.data < S.hoje;
    return `<tr><td>${DIAS[dow(d.data)]} ${brData(d.data)}</td><td>${iniciado || passado ? esc(d.atrib?.colaborador_nome || "—") : `<select data-chg="resp" data-d="${d.data}" style="padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)">${d.atrib ? "" : '<option value="">—</option>'}${opts(d.atrib?.colaborador_id)}</select>`}</td><td>${iniciado ? "Iniciada" : passado ? "Passou" : "Pode alterar"}</td></tr>`;
  }).join("")}</tbody></table></div></div>`;
}

function admAnalise() {
  const l = S.emAnalise;
  return `<div class="panel"><h2>Ocorrências em análise (${l.length})</h2><p class="muted">Encaminhadas ou não resolvidas na hora. Confirme para virar pendência, que entra na conferência da próxima auditoria, ou cancele com justificativa.</p>
  ${l.length ? l.map(o => ocCard(o, `<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="analise-ok" data-id="${o.id}">Confirmar pendência</button><button class="btn sm danger" data-act="analise-cancel" data-id="${o.id}">Cancelar</button><button class="btn sm sp" data-act="del-oc" data-id="${o.id}">Excluir</button></div>`)).join("") : `<p class="muted">Nada aguardando análise.</p>`}</div>`;
}
function admCtrl() {
  const a = S.aud;
  if (!a) return admAnalise() + `<div class="panel"><h2>Controle diário · ${brData(S.hoje)}</h2><p>Auditoria de hoje ainda não iniciada.</p><p class="muted">Responsável: ${esc(S.atrib?.colaborador_nome || "—")}</p></div>`;
  return admAnalise() + `<div class="panel"><h2>Controle diário · ${brData(S.hoje)}</h2>
  <div class="kpis"><div class="kpi"><b>${esc(a.colaborador_nome)}</b><span>Auditor</span></div><div class="kpi"><b>${audTxt[a.status]}</b><span>Status</span></div><div class="kpi"><b>${horaDe(a.horario_inicio)}</b><span>Início</span></div><div class="kpi"><b>${horaDe(a.horario_finalizacao)}</b><span>Finalização</span></div><div class="kpi"><b>${a.total_ocorrencias || 0}</b><span>Ocorrências</span></div></div>
  <div class="tw"><table><thead><tr><th>Setor</th><th>Status</th><th>Abertura</th><th>Conclusão</th><th>Ocorr.</th></tr></thead><tbody>
  ${S.audSet.map(s => `<tr><td>${esc(s.setor_nome)}</td><td>${stTxt[s.status]}</td><td>${horaDe(s.horario_inicio)}</td><td>${horaDe(s.horario_conclusao)}</td><td>${s.ocorrencias_count || 0}</td></tr>`).join("")}</tbody></table></div>
  ${S.audsHoje.length > 1 ? `<p class="muted">Hoje já houve ${S.audsHoje.length - 1} reinício(s).</p>` : ""}
  <div class="row" style="margin-top:12px"><button class="btn sm" data-act="reiniciar">Reiniciar auditoria de hoje</button><button class="btn sm danger" data-act="excluir" data-id="${a.id}">Excluir auditoria de hoje</button></div></div>`;
}

function admCrud(k) {
  const [, alvo, titulo] = COLS[k], lista = S[alvo];
  return `<div class="panel"><h2>${titulo}</h2>
  <div class="row" style="margin-bottom:12px"><input id="novoNome" placeholder="Novo nome" style="flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)"><button class="btn sm primary" data-act="add" data-k="${k}">Adicionar</button></div>
  ${k === "col" ? `<p class="muted" style="font-size:14px">Fixo = não entra no rodízio (ex.: quem cuida do CQ). O rodízio segue a ordem desta lista.</p>` : ""}
  <div class="tw"><table><thead><tr><th>Ordem</th><th>Nome</th><th>Ativo</th>${k === "col" ? "<th>Fixo</th>" : ""}<th></th></tr></thead><tbody>
  ${lista.map((x, i) => `<tr><td><button class="btn sm" data-act="mover" data-k="${k}" data-id="${x.id}" data-v="-1" ${i === 0 ? "disabled" : ""} aria-label="Subir">▲</button> <button class="btn sm" data-act="mover" data-k="${k}" data-id="${x.id}" data-v="1" ${i === lista.length - 1 ? "disabled" : ""} aria-label="Descer">▼</button></td>
    <td><input value="${esc(x.nome)}" data-chg="nome" data-k="${k}" data-id="${x.id}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);min-width:180px"></td>
    <td><input type="checkbox" data-chg="ativo" data-k="${k}" data-id="${x.id}" ${x.ativo ? "checked" : ""}></td>
    ${k === "col" ? `<td><input type="checkbox" data-chg="fixo" data-k="${k}" data-id="${x.id}" ${x.fixo ? "checked" : ""}></td>` : ""}
    <td><button class="btn sm danger" data-act="del" data-k="${k}" data-id="${x.id}">Excluir</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Nada cadastrado.</td></tr>`}
  </tbody></table></div></div>`;
}

function admHist() {
  const h = S.hist;
  if (!h.auds) return `<div class="panel">Carregando histórico…</div>`;
  const auditores = [...new Set(h.auds.map(a => a.colaborador_nome))].sort();
  const l = h.auds.filter(a => (!h.auditor || a.colaborador_nome === h.auditor) && (!h.status || a.status === h.status))
    .sort((a, b) => b.data.localeCompare(a.data) || String(b.horario_inicio).localeCompare(String(a.horario_inicio)));
  const badge = st => `<span class="badge ${st === "finalizada" ? "b-ok" : st === "reiniciada" ? "b-critica" : "b-pend"}">${audTxt[st]}</span>`;
  return `<div class="panel"><h2>Histórico de auditorias</h2><div class="filters">
    <input type="month" data-hist="mes" value="${h.mes}" aria-label="Mês">
    <select data-hist="auditor" aria-label="Auditor"><option value="">Auditor: todos</option>${auditores.map(x => `<option ${h.auditor === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
    <select data-hist="status" aria-label="Status"><option value="">Status: todos</option>${Object.entries(audTxt).map(([v, t]) => `<option value="${v}" ${h.status === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <div class="row" style="margin-bottom:12px"><span class="muted">${l.length} auditoria(s)</span><button class="btn sm sp" data-act="csv-mes">CSV do mês</button><button class="btn sm" data-act="csv-tudo">CSV de tudo</button></div>
  ${l.length ? l.map(a => {
    const ab = h.aberto[a.id];
    return `<div class="hist ${ab ? "open" : ""}"><div class="row">
      <button class="histhead" data-act="hist-abrir" data-id="${a.id}" aria-expanded="${!!ab}"><b class="cond" style="font-size:18px">${brData(a.data)}</b> <span>${esc(a.colaborador_nome)}</span> ${badge(a.status)}
        <span class="muted s">${horaDe(a.horario_inicio)}–${horaDe(a.horario_finalizacao)} · ${duracao(a.horario_inicio, a.horario_finalizacao)} · ${a.total_ocorrencias || 0} ocorr. · ${a.total_pendencias_conferidas || 0} conf.</span></button>
      <div class="sp row">${a.status === "finalizada" ? `<button class="btn sm dark" data-act="docx" data-id="${a.id}">${a.relatorio_gerado_em ? "Baixar .docx" : "Gerar .docx"}</button>` : ""}<button class="btn sm danger" data-act="excluir" data-id="${a.id}">Excluir</button></div></div>
      ${ab ? `<div class="histbody">
        ${a.observacao_final ? `<p><b>Observação:</b> ${esc(a.observacao_final)}</p>` : ""}${a.auditoria_original_id ? `<p class="muted">Reinício da auditoria ${esc(a.auditoria_original_id)}</p>` : ""}
        <div class="tw"><table><thead><tr><th>Setor</th><th>Status</th><th>Abertura</th><th>Conclusão</th><th>Ocorr.</th></tr></thead><tbody>${ab.setores.map(s => `<tr><td>${esc(s.setor_nome)}</td><td>${stTxt[s.status]}</td><td>${horaDe(s.horario_inicio)}</td><td>${horaDe(s.horario_conclusao)}</td><td>${s.ocorrencias_count || 0}</td></tr>`).join("")}</tbody></table></div>
        ${ab.ocs.length ? ab.ocs.map(o => ocCard(o)).join("") : `<p class="muted">Sem ocorrências.</p>`}</div>` : ""}</div>`;
  }).join("") : `<p class="muted">Nenhuma auditoria com esses filtros.</p>`}</div>`;
}
function admCfg() {
  const c = S.config;
  return `<div class="panel"><h2>Configuração do relatório</h2>
  <div class="field"><label for="cfNome">Nome da empresa</label><input id="cfNome" value="${esc(c.empresa_nome ?? "Lojas MM · CDAM")}"></div>
  <div class="field"><label for="cfSub">Subtítulo do relatório</label><input id="cfSub" value="${esc(c.empresa_subtitulo ?? "Relatório de auditoria operacional diária")}"></div>
  <div class="field"><label><input type="checkbox" id="cfFoto" ${c.foto_obrigatoria !== false ? "checked" : ""}> Foto obrigatória ao registrar ocorrência</label></div>
  <div class="field"><label>Logo do relatório</label><div class="row">${S.logo === undefined ? `<span class="muted">Carregando…</span>` : S.logo ? `<img src="${S.logo}" alt="Logo atual" class="logoprev"><button class="btn sm" data-act="logo">Trocar logo</button><button class="btn sm danger" data-act="logo-del">Voltar ao padrão</button>` : `<img src="${LOGO_PADRAO()}" alt="Logo padrão" class="logoprev"><span class="muted" style="font-size:13px">Logo padrão Lojas MM</span><button class="btn sm" data-act="logo">Enviar outro</button>`}</div>
  <p class="muted" style="font-size:13px;margin:4px 0 0">PNG com fundo transparente fica melhor. A imagem é reduzida automaticamente.</p></div>
  <button class="btn primary" data-act="cfg">Salvar configuração</button></div>`;
}

/* ================= MODAL ================= */
function abrirModal(html) { $("#sheet").innerHTML = html; $("#modal").classList.add("open"); }
function fechar() { $("#modal").classList.remove("open"); F = null; }
function modalFinalizar() {
  abrirModal(`<h2>Finalizar auditoria</h2><div class="auto">${S.audSet.length} setores concluídos · ${S.verifHoje.length} pendência(s) conferida(s) · ${S.aud?.total_ocorrencias || 0} ocorrência(s) nova(s) · horário de finalização registrado automaticamente</div>
  <div class="field"><label for="fObs">Observação geral do dia</label><textarea id="fObs" rows="3" placeholder="Resumo da ronda"></textarea></div>
  <div class="row"><button class="btn" data-act="fechar">Voltar</button><button class="btn primary sp" data-act="confirmar-fim">Finalizar auditoria</button></div>`);
}

/* ================= EVENTOS ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (el.tagName === "A") e.preventDefault();
  const d = el.dataset;
  switch (a) {
    case "modo": S.modo = d.v; break;
    case "tab": S.tab = d.v; if (d.v === "dias") return acao(carregarMes); if (d.v === "pend") return acao(carregarTodas); if (d.v === "ind") return acao(carregarInd); break;
    case "atab": S.adminTab = d.v; if (d.v === "prog") return acao(carregarProg); if (d.v === "hist") return acao(carregarHist); if (d.v === "ind") return acao(carregarInd); if (d.v === "cfg" && S.logo === undefined) return acao(carregarLogo); break;
    case "go-main": S.view = "main"; break;
    case "go-admin": S.view = "admin"; if (S.isAdmin && S.adminTab === "prog") return acao(carregarProg); break;
    case "sair": return acao(sair);
    case "login": return acao(() => entrarAdmin($("#lgUser").value, $("#lgPass").value));
    case "iniciar": return acao(iniciar);
    case "abrir-setor": return acao(() => abrirSetor(d.id));
    case "voltar": S.view = "main"; break;
    case "concluir-setor": return acao(concluirSetor);
    case "finalizar": return modalFinalizar();
    case "confirmar-fim": { const obs = $("#fObs").value; fechar(); return acao(() => finalizar(obs)); }
    case "fechar": return fechar();
    case "reiniciar": return acao(reiniciar);
    case "excluir": return acao(() => excluirAuditoria(d.id));
    case "mes": { const [y, m] = S.mes.split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1 + Number(d.v), 1)); S.mes = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}`; return acao(carregarMes); }
    case "semana": S.progRef = addDias(S.progRef, Number(d.v)); return acao(carregarProg);
    case "sorteio": return acao(refazerSorteio);
    case "add": { const n = $("#novoNome").value; return acao(() => addCad(d.k, n)); }
    case "mover": return acao(() => moverCad(d.k, d.id, Number(d.v)));
    case "del": return acao(() => delCad(d.k, d.id));
    case "padrao": return acao(criarPadrao);
    case "cfg": { const dados = { empresa_nome: $("#cfNome").value.trim(), empresa_subtitulo: $("#cfSub").value.trim(), foto_obrigatoria: $("#cfFoto").checked }; return acao(() => salvarConfig(dados)); }
    case "msg": return toast(d.m);
    case "registrar": return modalRegistrar(null);
    case "chip": { if (!F && d.k !== "x") return; F[d.k] = d.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); if (d.k === "acao") atualizarObrigatorios();
      if (d.k === "res") { $("#confResolvido").hidden = d.v !== "resolvido"; $("#confContinua").hidden = d.v !== "continua_pendente"; $("#confEscolha").hidden = true; } return; }
    case "continuar-oc": { const ref = F?.oc; if (!ref) return; fechar(); return modalRegistrar(ref); }
    case "foto": F.alvo = d.v; $("#fotoInput").value = ""; return $("#fotoInput").click();
    case "salvar-oc": return acao(salvarOcorrencia);
    case "del-oc": return acao(async () => { await excluirOcorrencia(d.id); if (S.todasOcs) await carregarTodas(); });
    case "analise-ok": return acao(() => analiseConfirmar(d.id));
    case "analise-cancel": return acao(() => analiseCancelar(d.id));
    case "ver-foto": return verFoto(d.id, d.l);
    case "conferir": return modalConferir(d.id);
    case "salvar-conf": return acao(salvarConferencia);
    case "resolver": return modalResolver(d.id);
    case "salvar-resolver": return acao(salvarResolucao);
    case "recarregar-pend": return acao(carregarTodas);
    case "docx": return acao(() => gerarRelatorioDocx(d.id));
    case "csv-aud": return acao(() => csvDaAuditoria(d.id, d.d));
    case "csv-mes": return acao(csvDoMes);
    case "csv-tudo": return acao(csvTudo);
    case "hist-abrir": return acao(() => abrirHist(d.id));
    case "logo": $("#logoInput").value = ""; return $("#logoInput").click();
    case "logo-del": return acao(removerLogo);
    case "sem-nav": { const n = addDias(S.ind.sem, Number(d.v)); if (n > segundaDe(S.hoje)) return; S.ind.sem = n; break; }
    case "sem-docx": return acao(() => gerarRelatorioSemanal(S.ind.sem));
    case "ind-per": S.ind.per = d.v; if (d.v === "custom" && !S.ind.ini) { S.ind.ini = addDias(S.hoje, -29); S.ind.fim = S.hoje; } return acao(carregarInd);
    default: return;
  }
  render();
});
document.addEventListener("change", e => {
  const pf = e.target.closest("select[data-pf]");
  if (pf) return aplicarFiltro(pf);
  const ic = e.target.closest("[data-ind]");
  if (ic) { if (!ic.value) return; S.ind[ic.dataset.ind] = ic.value; return acao(carregarInd); }
  const hs = e.target.closest("[data-hist]");
  if (hs) { S.hist[hs.dataset.hist] = hs.value; if (hs.dataset.hist === "mes") { if (!hs.value) return; S.hist.auditor = ""; return acao(carregarHist); } return render(); }
  const el = e.target.closest("[data-chg]");
  if (!el) return;
  const d = el.dataset;
  if (d.chg === "resp") return el.value && acao(() => trocarResponsavel(d.d, el.value));
  if (d.chg === "nome") { const v = el.value.trim(); if (!v) return render(); return acao(() => updCad(d.k, d.id, { nome: v })); }
  if (d.chg === "ativo" || d.chg === "fixo") return acao(() => updCad(d.k, d.id, { [d.chg]: el.checked }));
});
function aplicarFiltro(el) {
  S.pf[el.dataset.pf] = el.value;
  const l = $("#pfLista"); if (l) { l.innerHTML = listaPend(); hydrateFotos(); }
}
document.addEventListener("input", e => { const el = e.target.closest("[data-pf]"); if (el && el.tagName === "INPUT") aplicarFiltro(el); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "lgPass" || e.target.id === "lgUser")) $("[data-act=login]")?.click(); if (e.key === "Enter" && e.target.id === "novoNome") $("[data-act=add]")?.click(); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" && !F) fechar(); });
$("#logoInput").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) acao(() => salvarLogo(f)); });
$("#fotoInput").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) receberFoto(f).catch(err => toast(err.userMsg || "Erro ao processar a foto.")); });

// virada do dia com a página aberta
setInterval(() => { if (todayStr() !== S.hoje && S.pronto) acao(carregarDia); }, 60000);

/* ================= AUTENTICAÇÃO ================= */
onAuthStateChanged(auth, async user => {
  if (!user) { try { await signInAnonymously(auth); } catch (e) { console.error(e); $("#app").innerHTML = `<div class="panel" style="margin-top:24px">Não foi possível conectar: ${esc(e.code || e.message)}</div>`; } return; }
  S.user = user; S.isAdmin = false; S.adminNome = "";
  if (!user.isAnonymous) {
    try {
      const u = await getDoc(doc(db, "usuarios", user.uid));
      if (u.exists() && u.data().perfil === "admin") { S.isAdmin = true; S.adminNome = u.data().nome || user.email.replace(DOMINIO, ""); }
      else { toast("Esta conta não tem acesso de admin."); await signOut(auth); return; }
    } catch (e) { console.error(e); toast("Erro ao verificar acesso."); await signOut(auth); return; }
  }
  // reassina a cada troca de conta (anônimo ↔ admin), pois a troca derruba as escutas antigas
  try { await assinarCadastros(); await carregarDia(); S.pronto = true; }
  catch (e) { console.error(e); $("#app").innerHTML = `<div class="panel" style="margin-top:24px">Erro ao carregar: ${esc(e.code || e.message)}</div>`; return; }
  if (S.isAdmin && S.view === "admin" && S.adminTab === "prog") { try { await carregarProg(); } catch (e) { console.error(e); } }
  if (S.isAdmin) limparFotosAntigas().catch(e => console.error(e));
  render();
});
render();

</script>
</body>
</html>
